<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULSEFALL — top-down arena survival shooter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #070a18; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="PULSEFALL: a top-down arena survival shooter. Move with WASD, aim with the mouse, click to shoot, dash with Shift."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
